<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="28" fill="#020617"/>
  <rect x="32" y="32" width="1136" height="696" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2"/>

  <text x="600" y="78" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">AWS Cloud Resume Architecture</text>
  <text x="600" y="112" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Static hosting, secure delivery, serverless visitor counter, monitoring and CI/CD</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <style>
    .box { fill: #1E293B; stroke: #334155; stroke-width: 2; }
    .box2 { fill: #111827; stroke: #38BDF8; stroke-width: 2; }
    .label { fill: #F8FAFC; font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; text-anchor: middle; }
    .sub { fill: #CBD5E1; font-family: Arial, Helvetica, sans-serif; font-size: 14px; text-anchor: middle; }
    .line { stroke: #38BDF8; stroke-width: 3; marker-end: url(#arrow); }
    .dash { stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    .small { fill: #94A3B8; font-family: Arial, Helvetica, sans-serif; font-size: 13px; text-anchor: middle; }
  </style>

  <!-- User -->
  <rect class="box2" x="90" y="180" width="180" height="90" rx="16"/>
  <text class="label" x="180" y="218">User Browser</text>
  <text class="sub" x="180" y="245">Portfolio visitor</text>

  <!-- Route 53 / ACM -->
  <rect class="box" x="360" y="170" width="210" height="110" rx="16"/>
  <text class="label" x="465" y="212">Route 53 + ACM</text>
  <text class="sub" x="465" y="240">DNS + HTTPS</text>

  <!-- CloudFront -->
  <rect class="box2" x="660" y="170" width="210" height="110" rx="16"/>
  <text class="label" x="765" y="212">CloudFront</text>
  <text class="sub" x="765" y="240">CDN + OAC</text>

  <!-- S3 -->
  <rect class="box" x="930" y="170" width="190" height="110" rx="16"/>
  <text class="label" x="1025" y="212">Private S3</text>
  <text class="sub" x="1025" y="240">Static files</text>

  <!-- Dashboard -->
  <rect class="box" x="240" y="380" width="230" height="110" rx="16"/>
  <text class="label" x="355" y="422">Dashboard</text>
  <text class="sub" x="355" y="450">Views + uniques</text>

  <!-- API Gateway -->
  <rect class="box2" x="550" y="380" width="210" height="110" rx="16"/>
  <text class="label" x="655" y="422">API Gateway</text>
  <text class="sub" x="655" y="450">HTTPS endpoint</text>

  <!-- Lambda -->
  <rect class="box" x="850" y="380" width="210" height="110" rx="16"/>
  <text class="label" x="955" y="422">Lambda</text>
  <text class="sub" x="955" y="450">Python backend</text>

  <!-- DynamoDB -->
  <rect class="box" x="850" y="565" width="210" height="105" rx="16"/>
  <text class="label" x="955" y="605">DynamoDB</text>
  <text class="sub" x="955" y="633">Visitor records</text>

  <!-- CloudWatch -->
  <rect class="box" x="550" y="565" width="210" height="105" rx="16"/>
  <text class="label" x="655" y="605">CloudWatch</text>
  <text class="sub" x="655" y="633">Logs + metrics</text>

  <!-- GitHub Actions -->
  <rect class="box" x="90" y="565" width="240" height="105" rx="16"/>
  <text class="label" x="210" y="605">GitHub Actions</text>
  <text class="sub" x="210" y="633">CI/CD deploy</text>

  <!-- Lines -->
  <line class="line" x1="270" y1="225" x2="360" y2="225"/>
  <line class="line" x1="570" y1="225" x2="660" y2="225"/>
  <line class="line" x1="870" y1="225" x2="930" y2="225"/>

  <path class="line" d="M765 280 C765 325 655 325 655 380"/>
  <line class="line" x1="470" y1="435" x2="550" y2="435"/>
  <line class="line" x1="760" y1="435" x2="850" y2="435"/>
  <line class="line" x1="955" y1="490" x2="955" y2="565"/>
  <path class="dash" d="M850 435 C760 510 720 540 655 565"/>
  <path class="dash" d="M330 618 C410 618 465 600 550 600"/>
  <path class="dash" d="M210 565 C250 510 320 495 355 490"/>

  <text class="small" x="600" y="715">Built to demonstrate AWS hosting, security, serverless, monitoring, CI/CD and troubleshooting skills.</text>
</svg>
