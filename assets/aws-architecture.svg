<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="28" fill="#020617"/>
  <rect x="32" y="32" width="1136" height="696" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2"/>

  <text x="600" y="78" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">AWS Cloud Resume Architecture</text>
  <text x="600" y="112" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Secure static hosting, serverless visitor counter, monitoring and CI/CD deployment</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#CBD5E1"/>
    </marker>
  </defs>

  <style>
    .box { fill: #1E293B; stroke: #334155; stroke-width: 2; }
    .main { fill: #111827; stroke: #38BDF8; stroke-width: 2.4; }
    .label { fill: #F8FAFC; font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; text-anchor: middle; }
    .sub { fill: #CBD5E1; font-family: Arial, Helvetica, sans-serif; font-size: 14px; text-anchor: middle; }
    .line { stroke: #38BDF8; stroke-width: 3; marker-end: url(#arrow); }
    .dash { stroke: #CBD5E1; stroke-width: 2.5; stroke-dasharray: 8 8; marker-end: url(#arrowGrey); }
    .small { fill: #94A3B8; font-family: Arial, Helvetica, sans-serif; font-size: 13px; text-anchor: middle; }
  </style>

  <!-- Top row -->
  <rect class="main" x="80" y="175" width="170" height="90" rx="16"/>
  <text class="label" x="165" y="213">User Browser</text>
  <text class="sub" x="165" y="240">Visitor</text>

  <rect class="box" x="330" y="165" width="205" height="110" rx="16"/>
  <text class="label" x="432" y="207">Route 53 + ACM</text>
  <text class="sub" x="432" y="235">DNS + HTTPS</text>

  <rect class="main" x="615" y="165" width="205" height="110" rx="16"/>
  <text class="label" x="717" y="207">CloudFront</text>
  <text class="sub" x="717" y="235">CDN + OAC</text>

  <rect class="box" x="905" y="165" width="205" height="110" rx="16"/>
  <text class="label" x="1007" y="207">Private S3</text>
  <text class="sub" x="1007" y="235">Website files</text>

  <!-- Frontend -->
  <rect class="main" x="455" y="355" width="270" height="105" rx="16"/>
  <text class="label" x="590" y="396">Portfolio / Dashboard</text>
  <text class="sub" x="590" y="424">HTML, CSS, JavaScript</text>

  <!-- Serverless backend -->
  <rect class="box" x="110" y="530" width="210" height="105" rx="16"/>
  <text class="label" x="215" y="570">API Gateway</text>
  <text class="sub" x="215" y="598">HTTPS API</text>

  <rect class="box" x="485" y="530" width="210" height="105" rx="16"/>
  <text class="label" x="590" y="570">Lambda</text>
  <text class="sub" x="590" y="598">Python backend</text>

  <rect class="box" x="860" y="530" width="210" height="105" rx="16"/>
  <text class="label" x="965" y="570">DynamoDB</text>
  <text class="sub" x="965" y="598">Visitor records</text>

  <rect class="box" x="485" y="655" width="210" height="72" rx="16"/>
  <text class="label" x="590" y="686">CloudWatch</text>
  <text class="sub" x="590" y="710">Logs + metrics</text>

  <!-- CI/CD -->
  <rect class="box" x="905" y="355" width="205" height="105" rx="16"/>
  <text class="label" x="1007" y="396">GitHub Actions</text>
  <text class="sub" x="1007" y="424">Deploy + invalidate</text>

  <!-- Main traffic lines -->
  <line class="line" x1="250" y1="220" x2="330" y2="220"/>
  <line class="line" x1="535" y1="220" x2="615" y2="220"/>
  <line class="line" x1="820" y1="220" x2="905" y2="220"/>
  <path class="line" d="M1007 275 C1007 330 720 330 650 355"/>

  <!-- Frontend API calls -->
  <path class="line" d="M455 407 C335 410 270 455 215 530"/>
  <line class="line" x1="320" y1="582" x2="485" y2="582"/>
  <line class="line" x1="695" y1="582" x2="860" y2="582"/>

  <!-- Monitoring -->
  <line class="dash" x1="590" y1="635" x2="590" y2="655"/>

  <!-- CI/CD deployment -->
  <path class="dash" d="M1007 355 C1045 310 1045 285 1007 275"/>
  <path class="dash" d="M905 407 C825 390 790 360 735 275"/>

  <text class="small" x="600" y="746">GitHub Actions deploys site files to S3 and triggers CloudFront invalidation. Frontend JavaScript calls API Gateway, which invokes Lambda and updates DynamoDB.</text>
</svg>
